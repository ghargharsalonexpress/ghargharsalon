# Local MongoDB as a one-node replica set (transactions need one), for machines with Docker.
# Without Docker, `npm run db` in apps/api does the same with no install.
#   docker compose -f infra/docker-compose.dev.yml up -d
# MONGODB_URI=mongodb://127.0.0.1:27018/brand?replicaSet=rs0

services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then simply reports its status.
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo_data:
